<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Website</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .card {

        h1 {

            color: #475569;
        }

<body>
    <main class="card">
        <h1>Hello World!</h1>
        <p>My first Python website on AWS EC2.</p>

</html>
